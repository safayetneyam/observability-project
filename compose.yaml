# DevTrails observability stack: Prometheus, Grafana, Loki, Node Exporter and the DevTrails app.
# Every published port binds to 127.0.0.1, so nothing is reachable from a public interface.
# On EC2, reach the UIs through an SSH tunnel (see README).
name: devtrails-observability

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  observability:
    name: observability
    ipam:
      config:
        # Fixed subnet: the gateway (172.28.0.1) is a host-only bridge address where
        # Node Exporter (host network namespace) listens privately. Keep in sync with prometheus.yml.
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  app-data:

services:
  app:
    build: ./app
    image: devtrails-app:1.0.0
    container_name: devtrails-app
    restart: unless-stopped
    environment:
      APP_VERSION: "1.0.0"
      DB_PATH: /data/devtrails.db
      CHAOS_TOKEN: ${CHAOS_TOKEN:-}
      PUBLIC_GRAFANA_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - app-data:/data
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"
      - "172.28.0.1:8000:8000"   # host-only: reachable by MicroK8s pods (learner-simulator)
    networks: [observability]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    # Host namespaces so CPU, memory, disk, network and uptime are the real Ubuntu host's.
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.28.0.1:9100   # host-only bridge IP, never public
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+|snap/.+)($|/)
      - --collector.netdev.device-exclude=^(veth.*|cali.*|br-.*|docker0|lo|vxlan.*|flannel.*)$
    volumes:
      - /:/host:ro,rslave
    depends_on: [prometheus]   # ensures the observability network/bridge exists first
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability]
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.3
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
      # Host-only bridge address: MicroK8s Alloy pods push logs here. Not on any public NIC.
      - "172.28.0.1:3100:3100"
    networks: [observability]
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO in .env}   # used by alerting provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?set SMTP_FROM_ADDRESS in .env}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DevTrails Alerts}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      GF_SMTP_SKIP_VERIFY: ${SMTP_SKIP_VERIFY:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devtrails-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability]
    depends_on: [prometheus, loki]
    logging: *default-logging

  # Optional local test inbox: `docker compose --profile mailpit up -d`
  # then set SMTP_HOST=mailpit:1025, SMTP_STARTTLS_POLICY=NoStartTLS in .env.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [observability]
    logging: *default-logging
