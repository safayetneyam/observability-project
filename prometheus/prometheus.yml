global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: devtrails

scrape_configs:
  # Real Ubuntu host metrics. Node Exporter runs in the host network namespace and
  # listens only on the host-only bridge gateway of the "observability" network.
  - job_name: node-exporter
    static_configs:
      - targets: ["172.28.0.1:9100"]
        labels:
          host: ubuntu-host

  # DevTrails HTTP application (Flask + prometheus_client), reached by service name.
  - job_name: devtrails-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: devtrails

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
